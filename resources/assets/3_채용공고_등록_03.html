<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
        content="width=device-width,viewport-fit=cover,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>인사이트베이</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="wrap">
        <!-- Start : Header -->
        <header class="header" id="header">
        </header>
        <!-- End : Header -->

        <!-- Start : Main -->
        <main>
            <section class="sub-sec">
                <div class="container">
                    <div class="job-select">
                        <div class="job-select-title">
                            <h3>채용공고가 정상적으로 등록되었습니다.<br>
                                등록한 공고가 <span>사전 검수 중</span> 입니다.</h3>
                            <p>영업일 1일 이내</p>
                        </div>
                    </div>
                    <div class="job-last-page">
                        <button type="button" class="btn btn-lg btn-white">공고 관리</button>
                    </div>
                    <div class="last-page-text">
                        <h6>사전 확인 서비스란?<br>
                            새롭게 등록 또는 수정한 모든 공고에 서비스 제공. 최저임급법 위반 공고, 프로모션 등 확인 후 완료 시 즉시 개제<br>
                            *단, 부적절한 공고로 확인될 경우 게시가 제한됨을 안내드립니다.</h6>
                    </div>
                </div>
            </section>
        </main>
        <!-- End : Main -->

        <!-- Start : Footer -->
        <footer class="footer" id="footer"></footer>
        <!-- End : Footer -->
    </div>



    <!-- Start : Script -->
    <script src="lib/jquery.min.js"></script>
    <script src="lib/swiper-bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/component.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/new.js"></script>
    <!-- End : Script -->

</body>

</html>
