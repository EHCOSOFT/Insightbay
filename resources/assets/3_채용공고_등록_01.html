<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
        content="width=device-width,viewport-fit=cover,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>인사이트베이</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="wrap">
        <!-- Start : Header -->
        <header class="header" id="header">
        </header>
        <!-- End : Header -->

        <!-- Start : Main -->
        <main>
            <section class="sub-sec">
                <div class="container">
                    <div class="job-select">
                        <div class="job-select-title">
                            <p>고스펙 지원자들이 매일 확인하는</p>
                            <h3>채용공고 등록하기</h3>
                        </div>
                        <ul>
                            <li>
                                <a href="javascript:void(0);">
                                    <h2>인턴/RA/계약직<br>
                                        채용공고 등록</h2>
                                    <p>적은 비용으로 빠르게,<br>
                                        잠재력 있는 인재를 만나는 방법</p>
                                    <button type="button" class="btn btn-lg btn-white">300,000원</button>
                                </a>
                            </li>
                            <li>
                                <a href="javascript:void(0);">
                                    <h2>신입/경력<br>
                                        채용공고 등록</h2>
                                    <p>바로 투입 가능한 실무자를 찾는<br>
                                        가장 확실한 방법</p>
                                    <button type="button" class="btn btn-lg btn-white">500,000원</button>
                                </a>
                            </li>
                            <li>
                                <a href="javascript:void(0);">
                                    <h2>헤드헌팅<br>
                                        서비스</h2>
                                    <p>시간을 아끼고,<br>
                                        실패 확률을 줄이는 채용 방식</p>
                                    <button type="button" class="btn btn-lg btn-white">문의하기</button>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </section>
        </main>
        <!-- End : Main -->

        <!-- Start : Footer -->
        <footer class="footer" id="footer"></footer>
        <!-- End : Footer -->
    </div>



    <!-- Start : Script -->
    <script src="lib/jquery.min.js"></script>
    <script src="lib/swiper-bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/component.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/new.js"></script>
    <!-- End : Script -->

</body>

</html>
