<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
        content="width=device-width,viewport-fit=cover,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>인사이트베이</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="wrap">
        <!-- Start : Header -->
        <header class="header" id="header">
        </header>
        <!-- End : Header -->

        <!-- Start : Main -->
        <main>
            <section class="sub-sec">
                <div class="container">
                    <form action="" id="loginForm" class="form-wrap">
                        <div class="login">
                            <h2>기업회원 로그인</h2>
                            <div class="input-wrap">
                                <div class="input-group input-white">
                                    <label for="emailInput">이메일</label>
                                    <input type="text" id="emailInput" class="email-input">
                                    <small>이메일 형식이 일치하지 않습니다.</small>
                                </div>
                                <div class="input-group input-white">
                                    <label for="pwInput">비밀번호</label>
                                    <div class="input-group-child">
                                        <input type="password" id="pwInput">
                                        <button type="button" class="btn btn-pw-eye">
                                            <img src="img/ico/i-eye-hide.svg" alt="비밀번호 숨김">
                                        </button>
                                    </div>
                                    <small>비밀번호가 일치하지 않습니다.</small>
                                </div>
                            </div>
                            <div class="btn-group column">
                                <button type="submit" class="btn btn-primary btn-login" form="loginForm">로그인</button>
                            </div>
                            <div class="link-group">
                                <a href="javascript:void(0);" class="open-modal" data-modal-id="pwFindModal">비밀번호 찾기</a>
                                <div class="link-group-child">
                                    <p>아직 회원이 아니신가요? <a href="2_기업_회원가입.html">회원가입</a></p>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </main>
        <!-- End : Main -->

        <!-- Start : Footer -->
        <footer class="footer" id="footer"></footer>
        <!-- End : Footer -->
    </div>

    <!-- Start : Script -->
    <script src="lib/jquery.min.js"></script>
    <script src="lib/swiper-bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/component.js"></script>
    <script src="js/modal.js"></script>
    <!-- End : Script -->

</body>

</html>
